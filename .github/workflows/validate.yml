name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Homebrew/actions publishes no release tags; pinned to main as of 2026-10-27.
      - uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # main 2026-10-27

      - name: Ruby syntax of every formula
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(Formula/*.rb)
          [ "${#files[@]}" -gt 0 ] || { echo "no formulae found"; exit 1; }
          for f in "${files[@]}"; do
            echo "ruby syntax: $f"
            brew ruby -e "RubyVM::InstructionSequence.compile_file('$f'); puts 'Syntax OK'"
          done

      - name: Link this checkout as the nwlnexus/olympus tap
        run: |
          set -euo pipefail
          tap_dir="$(brew --repository)/Library/Taps/nwlnexus"
          mkdir -p "$tap_dir"
          ln -sfn "$GITHUB_WORKSPACE" "$tap_dir/homebrew-olympus"
          brew tap | grep -x 'nwlnexus/olympus'

      - name: brew style
        run: brew style nwlnexus/olympus

      # --online is deliberately not used: the formula homepage is the private olympus-sdk repo,
      # which the online check reports as HTTP 404 from an unauthenticated runner.
      - name: brew audit --strict
        run: brew audit --strict nwlnexus/olympus/atlas
